<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Value List</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #050505;
            color: white;
        }

        header {
            height: 70px;
            background: #0d0d0d;
            border-bottom: 1px solid #222;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 35px;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .logo span {
            color: #6c63ff;
        }

        /* 언어 버튼 */

        .language-btn {
            background: #161616;
            border: 1px solid #333;
            color: white;

            padding: 10px 16px;

            border-radius: 10px;

            cursor: pointer;

            font-size: 14px;
            font-weight: bold;

            transition: 0.2s;
        }

        .language-btn:hover {
            border-color: #6c63ff;
            background: #1d1d1d;
        }

        .search-box {
            display: flex;
            justify-content: center;

            margin: 30px auto;
        }

        .search {
            width: 90%;
            max-width: 600px;

            background: #111;
            border: 1px solid #292929;
            border-radius: 12px;

            padding: 15px 18px;

            color: white;
            outline: none;

            font-size: 16px;
        }

        .search:focus {
            border-color: #6c63ff;
        }

        .title {
            width: 90%;
            max-width: 1100px;

            margin: 20px auto;
        }

        .title h1 {
            font-size: 30px;
        }

        .title p {
            color: #888;
            margin-top: 7px;
        }

        .items {
            width: 90%;
            max-width: 1100px;

            margin: 25px auto 60px;

            display: grid;

            grid-template-columns:
                repeat(auto-fill, minmax(230px, 1fr));

            gap: 18px;
        }

        .card {
            background: #101010;

            border: 1px solid #242424;
            border-radius: 15px;

            padding: 20px;

            transition: 0.2s;
        }

        .card:hover {
            transform: translateY(-4px);

            border-color: #6c63ff;
            background: #141414;
        }

        .item-name {
            font-size: 19px;
            font-weight: bold;

            margin-bottom: 8px;
        }

        .rarity {
            color: #888;

            font-size: 13px;
        }

        .value {
            margin-top: 18px;

            font-size: 22px;
            font-weight: bold;

            color: #6c63ff;
        }

        .value-label {
            color: #777;

            font-size: 12px;

            margin-right: 5px;
        }

        /* 모바일 */

        @media (max-width: 600px) {

            header {
                padding: 0 20px;
            }

            .title h1 {
                font-size: 25px;
            }

            .items {
                grid-template-columns: repeat(2, 1fr);

                gap: 10px;
            }

            .card {
                padding: 14px;
            }

            .item-name {
                font-size: 16px;
            }

            .value {
                font-size: 19px;
            }

            .language-btn {
                padding: 9px 12px;
            }
        }

    </style>
</head>

<body>

<header>

    <div class="logo">
        VALUE<span>LIST</span>
    </div>

    <!-- 언어 변경 버튼 -->
    <button
        class="language-btn"
        id="languageBtn"
        onclick="toggleLanguage()"
    >
        한국어
    </button>

</header>


<!-- 검색 -->

<div class="search-box">

    <input
        type="text"
        class="search"
        id="search"
        placeholder="Search..."
        oninput="searchItems()"
    >

</div>


<!-- 제목 -->

<div class="title">

    <h1 id="title">
        📊 Value List
    </h1>

    <p id="subtitle">
        Find the Value
    </p>

</div>


<!-- 아이템 -->

<div class="items" id="items"></div>


<script>

    /*
    =================================
    아이템 목록
    =================================
    */

    const items = [

        {
            name: "Hyper Titan Speakerman",
            koreanName: "하이퍼 타이탄 스피커맨",

            rarity: "Astral",
            koreanRarity: "아스트랄",

            value: "200K"
        },

        {
            name: "Golden Future",
            koreanName: "골든 퓨처",

            rarity: "Secret",
            koreanRarity: "시크릿",

            value: "70K"
        },

        {
            name: "Upgraded Titan Drillman",
            koreanName: "업그레이드 타이탄 드릴맨",

            rarity: "Secret",
            koreanRarity: "시크릿",

            value: "45K"
        },

        {
            name: "Upgraded Titan TV",
            koreanName: "업그레이드 타이탄 TV",

            rarity: "Secret",
            koreanRarity: "시크릿",

            value: "62K"
        },

        {
            name: "Golden Titan Cameraman",
            koreanName: "골든 타이탄 카메라맨",

            rarity: "Secret",
            koreanRarity: "시크릿",

            value: "25K"
        },

        {
            name: "Sinister Titan Clockman",
            koreanName: "시니스터 타이탄 클락맨",

            rarity: "Secret",
            koreanRarity: "시크릿",

            value: "85K"
        },

        {
            name: "Astro Titan Cameraman",
            koreanName: "아스트로 타이탄 카메라맨",

            rarity: "Secret",
            koreanRarity: "시크릿",

            value: "32K"
        },

        {
            name: "Titan Cameraman",
            koreanName: "타이탄 카메라맨",

            rarity: "Exclusive (Robux)",
            koreanRarity: "익스클루시브 (로벅스)",

            value: "12K"
        },

        {
            name: "Engineer Cameraman",
            koreanName: "엔지니어 카메라맨",

            rarity: "Exotic",
            koreanRarity: "엑조틱",

            value: "8K"
        },

        {
            name: "Upgraded Titan Cameraman",
            koreanName: "업그레이드 타이탄 카메라맨",

            rarity: "Mythic",
            koreanRarity: "신화",

            value: "2K"
        },

        {
            name: "Titan Cineman",
            koreanName: "타이탄 시네맨",

            rarity: "Mythic",
            koreanRarity: "신화",

            value: "2.2K"
        },

        {
            name: "Upgraded Titan Speakerman",
            koreanName: "업그레이드 타이탄 스피커맨",

            rarity: "Mythic",
            koreanRarity: "신화",

            value: "1.7K"
        }

    ];


    /*
    =================================
    현재 언어
    =================================
    */

    let korean = false;


    /*
    =================================
    아이템 표시
    =================================
    */

    function displayItems(list) {

        const container =
            document.getElementById("items");

        container.innerHTML = "";


        list.forEach(item => {

            const card =
                document.createElement("div");

            card.className = "card";


            if (korean) {

                card.innerHTML = `

                    <div class="item-name">
                        ${item.koreanName}
                    </div>

                    <div class="rarity">
                        ${item.koreanRarity}
                    </div>

                    <div class="value">

                        <span class="value-label">
                            가치
                        </span>

                        ${item.value}

                    </div>

                `;

            } else {

                card.innerHTML = `

                    <div class="item-name">
                        ${item.name}
                    </div>

                    <div class="rarity">
                        ${item.rarity}
                    </div>

                    <div class="value">

                        <span class="value-label">
                            VALUE
                        </span>

                        ${item.value}

                    </div>

                `;

            }


            container.appendChild(card);

        });

    }


    /*
    =================================
    언어 변경
    =================================
    */

    function toggleLanguage() {

        korean = !korean;


        const title =
            document.getElementById("title");

        const subtitle =
            document.getElementById("subtitle");

        const button =
            document.getElementById("languageBtn");

        const search =
            document.getElementById("search");


        if (korean) {

            title.innerHTML = "📊 가치표";

            subtitle.innerHTML =
                "아이템의 가치를 확인하세요";

            button.innerHTML = "English";

            search.placeholder = "검색...";

        } else {

            title.innerHTML = "📊 Value List";

            subtitle.innerHTML =
                "Find the Value";

            button.innerHTML = "한국어";

            search.placeholder = "Search...";

        }


        searchItems();

    }


    /*
    =================================
    검색
    =================================
    */

    function searchItems() {

        const search =
            document
                .getElementById("search")
                .value
                .toLowerCase();


        const filtered =
            items.filter(item =>

                item.name
                    .toLowerCase()
                    .includes(search)

                ||

                item.koreanName
                    .toLowerCase()
                    .includes(search)

            );


        displayItems(filtered);

    }


    /*
    =================================
    처음 실행
    =================================
    */

    displayItems(items);

</script>

</body>
</html>
