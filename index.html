<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Value List</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #050505;
            color: white;
        }

        /* 상단 */
        header {
            height: 70px;
            background: #0d0d0d;
            border-bottom: 1px solid #222;

            display: flex;
            align-items: center;

            padding: 0 35px;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .logo span {
            color: #6c63ff;
        }

        /* 검색 */
        .search-box {
            display: flex;
            justify-content: center;

            margin: 30px auto;
        }

        .search {
            width: 90%;
            max-width: 600px;

            background: #111;
            border: 1px solid #292929;
            border-radius: 12px;

            padding: 15px 18px;

            color: white;
            outline: none;

            font-size: 16px;
        }

        .search:focus {
            border-color: #6c63ff;
        }

        /* 제목 */
        .title {
            width: 90%;
            max-width: 1100px;

            margin: 20px auto;
        }

        .title h1 {
            font-size: 30px;
        }

        .title p {
            color: #888;
            margin-top: 7px;
        }

        /* 아이템 목록 */
        .items {
            width: 90%;
            max-width: 1100px;

            margin: 25px auto 60px;

            display: grid;

            grid-template-columns:
                repeat(auto-fill, minmax(230px, 1fr));

            gap: 18px;
        }

        /* 카드 */
        .card {
            background: #101010;

            border: 1px solid #242424;
            border-radius: 15px;

            padding: 20px;

            transition: 0.2s;
        }

        .card:hover {
            transform: translateY(-4px);

            border-color: #6c63ff;
            background: #141414;
        }

        .item-name {
            font-size: 19px;
            font-weight: bold;

            margin-bottom: 8px;
        }

        .rarity {
            color: #888;

            font-size: 13px;
        }

        .value {
            margin-top: 18px;

            font-size: 22px;
            font-weight: bold;

            color: #6c63ff;
        }

        .value-label {
            color: #777;

            font-size: 12px;

            margin-right: 5px;
        }

        /* 모바일 */
        @media (max-width: 600px) {

            header {
                padding: 0 20px;
            }

            .title h1 {
                font-size: 25px;
            }

            .items {
                grid-template-columns: repeat(2, 1fr);

                gap: 10px;
            }

            .card {
                padding: 14px;
            }

            .item-name {
                font-size: 16px;
            }

            .value {
                font-size: 19px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">
        VALUE<span>LIST</span>
    </div>
</header>


<!-- 검색 -->

<div class="search-box">

    <input
        type="text"
        class="search"
        id="search"
        placeholder="아이템 검색..."
        oninput="searchItems()"
    >

</div>


<!-- 제목 -->

<div class="title">

    <h1>📊 Value List</h1>

    <p>Find the Value</p>

</div>


<!-- 아이템 -->

<div class="items" id="items"></div>


<script>

    /*
    =================================
    아이템 추가하는 곳
    =================================

    value는 반드시 "25K"처럼
    따옴표 안에 넣어주세요.

    예:

    value: "25K"

    */


    const items = [

        {
            name: "Hyper Titan Speakerman",
            rarity: "Astral",
            value: "25K"
        },

        {
            name: "Golden Future",
            rarity: "Secret",
            value: "70K"
        },

        {
            name: "Upgraded Titan Drillman",
            rarity: "Secret",
            value: "45K"
        },

        {
            name: "Upgraded Titan TV",
            rarity: "Secret",
            value: "62K"
        },

        {
            name: "Golden Titan Cameraman",
            rarity: "Secret",
            value: "25K"
        },

        {
            name: "Sinister Titan Clockman",
            rarity: "Secret",
            value: "85K"
        },

        {
            name: "Astro Titan Cameraman",
            rarity: "Secret",
            value: "32K"
        }

    ];


    /*
    =================================
    아이템 표시
    =================================
    */

    function displayItems(list) {

        const container = document.getElementById("items");

        container.innerHTML = "";


        list.forEach(item => {

            const card = document.createElement("div");

            card.className = "card";


            card.innerHTML = `

                <div class="item-name">
                    ${item.name}
                </div>

                <div class="rarity">
                    ${item.rarity}
                </div>

                <div class="value">

                    <span class="value-label">
                        VALUE
                    </span>

                    ${item.value}

                </div>

            `;


            container.appendChild(card);

        });

    }


    /*
    =================================
    검색
    =================================
    */

    function searchItems() {

        const search = document
            .getElementById("search")
            .value
            .toLowerCase();


        const filtered = items.filter(item =>

            item.name
                .toLowerCase()
                .includes(search)

        );


        displayItems(filtered);

    }


    /*
    =================================
    처음 실행
    =================================
    */

    displayItems(items);

</script>

</body>
</html>
